name: CI/CD Pipeline SQA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      # Etapa 1: Build
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalación de dependencias (Build)
        run: npm install

      # Etapa 2: Test
      - name: Ejecutar Pruebas Automatizadas y Cobertura
        run: npm test -- --coverage || true

      # Etapa 3 & 4: Analyze y Report (SonarCloud)
      - name: Análisis Estático con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
